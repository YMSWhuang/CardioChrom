[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiochrom"
version = "0.1.0rc2"
description = "Frozen cardiovascular virtual-epigenome inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.scripts]
cardiochrom = "cardiochrom.cli:main"

[tool.setuptools.packages.find]
include = ["cardiochrom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
